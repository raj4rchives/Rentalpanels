<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cartyweb - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #fff;
        }

        .login-container {
            width: 548px;
            max-width: calc(100% - 40px);
            margin: 150px auto 0;
        }

        .login-container label {
            display: block;
            font-size: 23px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #222;
        }

        .login-container .form-control {
            height: 61px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 20px;
            box-shadow: none;
        }

        .login-container .form-control:focus {
            border-color: #999;
            box-shadow: none;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .login-btn {
            width: 100%;
            height: 61px;
            background: #3982b9;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 23px;
        }

        .login-btn:hover {
            background: #3276aa;
        }

        @media (max-width: 600px) {
            .login-container {
                margin-top: 120px;
                max-width: calc(100% - 40px);
            }

            .login-container label {
                font-size: 20px;
            }

            .login-container .form-control,
            .login-btn {
                height: 58px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <form id="loginForm">

        <!-- Username -->
        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                class="form-control"
                required
            >
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                class="form-control"
                required
            >
        </div>

        <!-- Login -->
        <button type="submit" class="login-btn">
            Sign in
        </button>

    </form>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username && password) {
        localStorage.setItem("cartywebLoggedIn", "true");

        window.location.href = "dashboard.html";
    }
});
</script>

</body>
</html>
