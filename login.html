<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cartyweb - Login</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f1f1f1;
            min-height: 100vh;
        }

        .login-box {
            max-width: 900px;
            background: #fff;
            border: 1px solid #ddd;
            padding: 70px 80px;
        }

        .logo {
            width: 45px;
            height: 45px;
            background: #6758df;
            color: #fff;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
        }

        .form-control {
            height: 65px;
            font-size: 20px;
        }

        .login-btn {
            height: 65px;
            font-size: 22px;
            background: #4b91cd;
            border: none;
        }

        .login-btn:hover {
            background: #3f82b9;
        }

        @media (max-width: 576px) {
            .login-box {
                padding: 40px 25px;
            }

            .login-box h1 {
                font-size: 34px;
            }

            .form-control {
                height: 58px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">

    <div class="login-box w-100 shadow-sm">

        <!-- Logo -->
        <div class="text-center mb-5">
            <div class="logo mx-auto">C</div>
            <div class="fw-bold fs-4 mt-2">Cartyweb</div>
        </div>

        <!-- Heading -->
        <h1 class="fw-normal mb-5">
            Please login
        </h1>

        <!-- Login Form -->
        <form id="loginForm">

            <div class="mb-4">
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Email Address"
                    required
                >
            </div>

            <div class="mb-4">
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Password"
                    required
                >
            </div>

            <!-- Remember -->
            <div class="form-check mb-5">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                >

                <label
                    class="form-check-label fs-5"
                    for="remember"
                >
                    Remember me
                </label>
            </div>

            <!-- Login -->
            <button
                type="submit"
                class="btn btn-primary login-btn w-100"
            >
                Login
            </button>

        </form>

    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email && password) {

        localStorage.setItem("cartywebLoggedIn", "true");

        // Redirect after login
        window.location.href = "dashboard.html";
    }

});
</script>

</body>
</html>
